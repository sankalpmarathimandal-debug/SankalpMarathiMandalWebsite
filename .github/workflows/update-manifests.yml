name: Update auto-generated manifests

# Regenerates data/highlights.json, data/logo-variants.json, and
# data/culture-icons.json whenever images are added, renamed, or removed in
# the three folders that are documented (README.md) as "fully automatic" —
# the homepage highlight slider, the Community Pride Wall, and the homepage
# culture icon ribbon. Without this workflow, uploading a photo to any of
# these folders (including via the admin panel) does nothing until someone
# manually runs the matching script in scripts/ and commits the result.

on:
  push:
    branches: [main]
    paths:
      - 'assets/images/highlights/**'
      - 'assets/images/branding/logo-variants/**'
      - 'assets/images/culture-icons/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, needed for per-file commit dates)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate manifests
        run: |
          python3 scripts/generate_highlights.py
          python3 scripts/generate_logo_variants.py
          python3 scripts/generate_culture_icons.py

      - name: Commit changes if the manifests differ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/highlights.json data/logo-variants.json data/culture-icons.json; then
            git add data/highlights.json data/logo-variants.json data/culture-icons.json
            git commit -m "Auto-update highlights/logo-variants/culture-icons manifest [skip ci]"
            git push
          else
            echo "Manifests already up to date — nothing to commit."
          fi
